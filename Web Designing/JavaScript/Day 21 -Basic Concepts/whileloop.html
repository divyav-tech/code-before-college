<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While loop Example</title>
</head>
<body>
<script>
    document.write("<h2>While Loop- Print 1 to 5</h2>");
    var i=1;
    while(i<=5){
        document.write(i + ") Hi<br>");
        i++
    }

</script>
</body>
</html>
