<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do While Loop Example</title>
</head>
<body>
    <script>
        document.write("<h2>Do While Loop -Print 5 to 1 </h2>");

        var i=5;
        do{
            document.write(i+"<br>");
            i--

        }
        while(i>=1);
    </script>
    <!--task-->
    <h2>Student task- Print 10-1 using Do While Loop</h2>
    <script>
        var a=10;
        do{
            document.write(a+"<br>");
            a--;
        }
        while(a>=1);
    </script>
</body>
</html>
