<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forEach Loop</title>
</head>
<body>
    <h2>Fruits List:</h2>
    <script>
        var fruits =["Apple", "Banana" , "Mango", "Orange", "Pineapple"];

        fruits.forEach(function(fruit){
            document.write(fruit + "<br>");
        });
    </script>

</body>
</html>
