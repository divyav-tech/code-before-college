<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Practice</title>
</head>
<body>
    <script>
        //if else statement
        let marks = 40;

        if(marks>=33){
            document.write("pass");
        }
        else{
            document.write("Fail")
        };
        document.write("<br>");

        let age=20;
        if(age>=18){
            document.write("You are eligible to vote.")
        }
        else{
            document.write("Sorry! You are not eligible to vote.")
        };
        document.write("<br>");

        //else if
        let number=75;
        if(number>=90){
            document.write("Grade A")
        }
        else if(number>=75){
            document.write("Grade B")
        }
        else if(number>=60){
            document.write("Grade C")
        }
        else{
            document.write("Grade D")
        };
        document.write("<br>");


        //switch case
        var grade = 3;
        switch(grade){
            case(1):document.write("First Grade")
            break;
            case(2):document.write("Second Grade")
            break;
            case(3):document.write("Third Grade")
            break;
            case(4):document.write("Fourth Grade")
            break;
            case(5):document.write("Fifth Grade")
            break;
            case(6):document.write("Sixth Grade")
            break;
            case(7):document.write("Seventh Grade")
            break;
            case(8):document.write("Eighth Grade")
            break;
            case(9):document.write("Ninth Grade")
            break;
            case(10):document.write("Tenth Grade")
            break;
            case(11):document.write("Eleventh Grade")
            break;
            case(12):document.write("Twelft Grade")
            break;
            default:document.write("Write valid class")
        };
        document.write("<br>");

    </script>
</body>
</html>
