<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Loop Example</title>
</head>
<body>
    <script>
        document.write("<h2> For Loop-Even numbers from 2 to 10</h2>");
        for( var i=2; i<=10; i=i+2){
            document.write(i+"<br>");
        }
    </script>
    <!--task-->
    <h3>Odd numbers:(task)</h3>
    <script>
        for(var x=1; x<=15; x=x+2){
            document.write(x+"<br>");
        }
    </script>
</body>
</html>
