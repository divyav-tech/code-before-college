<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While loop practice</title>
</head>
<body>
    <!--TASK-->
    <H1>Printing reverse counting </H1>
    <script>
        
    var a=10;
    while(a>=1){
        document.write(a +") Vidya Institue of Computer Education <br>");
        a--;
    }
    </script>
</body>
</html>
